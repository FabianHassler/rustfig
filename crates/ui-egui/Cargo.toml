[package]
name = "rustfig-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustfig-geom.workspace = true
# Pick a colour from the screen (E4b); the unsafe OS calls live there (native only inside; empty on wasm).
rustfig-screenpick.workspace = true
rustfig-model.workspace = true
rustfig-engine.workspace = true
rustfig-render.workspace = true
rustfig-text = { path = "../text" }
egui.workspace = true
eframe.workspace = true
serde_json.workspace = true
log.workspace = true

[dev-dependencies]
ttf-parser.workspace = true
egui_kittest = { version = "0.33", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
# Install TeX Gyre fonts (F1): checksum and unpacking; the download runs through the system `curl`.
sha2.workspace = true
zip.workspace = true
# Copy as picture (E14): custom clipboard formats (PDF, SVG, PNG) on macOS, Windows and Linux/X11.
clipboard-rs = { version = "0.3.5", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Storage"] }
