[package]
name = "rustfig-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustfig-geom.workspace = true
rustfig-model.workspace = true
rustfig-text.workspace = true
rustfig-format.workspace = true
rustfig-render.workspace = true
fig2dev.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
image.workspace = true
# Rasterises the printed PDF for the Print panel's preview (B5).
hayro = "0.8"
# Joins the batch's PDFs into one print job (B5); both already come with hayro.
hayro-write = "0.8"
hayro-syntax = "0.8"
# SVG import (G7): usvg resolves CSS, transforms, use and shapes; text layout
# needs the built-in fonts (epaint_default_fonts), svgz is unpacked here with a size cap.
usvg = { version = "0.48", default-features = false, features = ["text"] }
flate2.workspace = true
epaint_default_fonts.workspace = true

[dev-dependencies]
proptest.workspace = true
# Rasterises fig2dev's SVG for the reference tests (tests only).
resvg = "0.48"
