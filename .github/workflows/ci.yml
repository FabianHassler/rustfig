# Plan tasks A2 and P1: the quality gates on every push and pull request, on
# Linux, Windows and macOS. The wasm check, the performance budgets and the
# fig2dev reference tools (system packages) run on Linux only.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runners have about 14 GB free; full debug info for every test binary
  # filled the disk (the linker died with a bus error). Line tables keep
  # panic backtraces readable; incremental builds only cost space here.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: cargo xtask ci (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    env:
      # The wasm check runs once, on Linux, where a missing target must fail
      # (CLAUDE.md); the other desktops skip it explicitly (xtask documents both).
      RUSTFIG_REQUIRE_WASM: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}
      RUSTFIG_SKIP_WASM: ${{ matrix.os != 'ubuntu-24.04' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (preinstalled toolsets RustFig doesn't use)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System packages (eframe, rfd's GTK dialogs, fig2dev and the PostScript fonts' URW clones for the A8 reference tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            fig2dev fonts-urw-base35
          fig2dev -V
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ runner.os == 'Linux' && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Quality gates (fmt, clippy, tests, layers, assets, licences, wasm on Linux)
        run: cargo xtask ci
      - name: Performance budgets (tuned on Linux)
        if: runner.os == 'Linux'
        run: cargo run --release -p rustfig-cli -- perf
      - name: fig2dev comparison images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fig2dev-reference-${{ matrix.name }}
          path: target/fig2dev-reference
          if-no-files-found: ignore
