# Plan task A2: the quality gates on every push and pull request (Linux).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A missing wasm target must fail, not skip (CLAUDE.md).
  RUSTFIG_REQUIRE_WASM: "1"

jobs:
  linux:
    name: cargo xtask ci (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # fig2dev is a private git dependency: let cargo's git fetch use a
      # token with read access to FabianHassler/fig2dev (repository secret).
      - name: Access to fig2dev
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.FIG2DEV_TOKEN }}@github.com/FabianHassler/fig2dev".insteadOf "https://github.com/FabianHassler/fig2dev"
      - name: System packages (eframe, rfd's GTK dialogs, fig2dev and the PostScript fonts' URW clones for the A8 reference tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            fig2dev fonts-urw-base35
          fig2dev -V
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Quality gates (fmt, clippy, tests, layers, assets, wasm)
        run: cargo xtask ci
      - name: Performance budgets
        run: cargo run --release -p rustfig-cli -- perf
      - name: fig2dev comparison images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fig2dev-reference
          path: target/fig2dev-reference
          if-no-files-found: ignore
