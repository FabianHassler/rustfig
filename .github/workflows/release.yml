# Plan task A2: on a v* tag (or by hand), the quality gates on Linux,
# Windows and macOS, then release builds attached to the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFIG_REQUIRE_WASM: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, exe: "" }
          - { name: windows-x86_64, os: windows-latest, exe: ".exe" }
          - { name: macos-arm64, os: macos-latest, exe: "" }
    steps:
      - uses: actions/checkout@v7
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            fig2dev fonts-urw-base35
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Quality gates
        run: cargo xtask ci
      - name: Release build
        run: cargo build --release -p rustfig -p rustfig-cli
      - name: Package (cargo xtask package)
        run: cargo xtask package
      - name: Archive of the plain binaries
        shell: bash
        run: |
          dir="rustfig-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/rustfig${{ matrix.exe }}" "target/release/rustfig-cli${{ matrix.exe }}" "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE LICENSE-xfig NOTICE ASSETS.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir"
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: rustfig-${{ matrix.name }}
          path: |
            rustfig-*.*z*
            target/package/*.dmg
            target/package/*.deb
            target/package/*.tar.gz
            target/package/*.zip

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The packages arrive under target/package/: flatten, so the release
      # carries the .dmg, .deb, .tar.gz and .zip next to the plain archives.
      - name: Collect the files
        run: find dist -mindepth 2 -type f -exec mv -f {} dist/ \; && ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # v0.9.0-beta.1 and the like are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
