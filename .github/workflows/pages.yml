# Plan C5: the site on GitHub Pages (https://fabianhassler.github.io/rustfig/):
# landing page and manual from `cargo xtask site`, the web version under app/;
# built with every release tag or by hand (`gh workflow run pages.yml`).
name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the web version
        run: cargo xtask web --public-url /rustfig/app/
      - name: Build the site (landing page, manual, the web app under app/)
        run: cargo xtask site --out site --app dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
